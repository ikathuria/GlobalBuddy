# Render blueprint: FastAPI backend + static Vite frontend.
# Secrets (sync: false) are entered in the Render dashboard, not committed.

services:
  - type: web
    name: globaldost-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AUTH_REQUIRED
        value: "true"
      - key: GRAPH_SOURCE
        value: markdown
      - key: GRAPH_DATA_DIR
        value: ../data/graph
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://globaldost.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

  - type: web
    name: globaldost-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # set to the globaldost-api URL
      - key: VITE_NEON_AUTH_URL
        sync: false
