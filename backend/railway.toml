# Railway deploy config for the FastAPI backend.
# In the Railway service settings, set the service Root Directory to `backend`
# so this file and requirements.txt are picked up.

[build]
builder = "nixpacks"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
